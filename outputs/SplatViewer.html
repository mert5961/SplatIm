<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaussian Splat Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101114; color: #f3f4f6; font: 14px system-ui, sans-serif; }
    #bar { align-items: center; background: #1b1d22; display: flex; gap: 12px; padding: 12px 16px; }
    #file { max-width: 330px; }
    #status { color: #b5bac6; }
    #stage { height: 610px; position: relative; width: 100%; }
    #stage canvas { display: block; height: 100% !important; width: 100% !important; }
    #help { color: #aeb4c1; margin-left: auto; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="bar">
    <input id="file" type="file" accept=".ply,.splat,.ksplat">
    <span id="status">Choose a Gaussian splat file to view it.</span>
    <span id="help">Drag to orbit · wheel to zoom</span>
  </div>
  <div id="stage"></div>
  <script type="importmap">
    {"imports": {"three": "./viewer-assets/three.module.js"}}
  </script>
  <script type="module">
    const fileInput = document.querySelector("#file");
    const status = document.querySelector("#status");
    const stage = document.querySelector("#stage");
    let viewer;
    let splats;

    async function loadViewer() {
      status.textContent = "Loading viewer…";
      splats = await import("./viewer-assets/gaussian-splats-3d.module.js");
      status.textContent = "Choose a Gaussian splat file to view it.";
    }

    function formatFor(file) {
      const extension = file.name.toLowerCase().split(".").pop();
      if (extension === "ply") return splats.SceneFormat.Ply;
      if (extension === "splat") return splats.SceneFormat.Splat;
      if (extension === "ksplat") return splats.SceneFormat.KSplat;
      throw new Error("Supported files are .ply, .splat, and .ksplat.");
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      try {
        if (!splats) await loadViewer();
        status.textContent = `Loading ${file.name}…`;
        viewer?.dispose?.();
        stage.replaceChildren();
        viewer = new splats.Viewer({
          rootElement: stage,
          cameraUp: [0, -1, -0.6],
          initialCameraPosition: [-1, -4, 6],
          initialCameraLookAt: [0, 4, 0],
          sharedMemoryForWorkers: false,
          gpuAcceleratedSort: false,
        });
        const source = URL.createObjectURL(file);
        await viewer.addSplatScene(source, {
          format: formatFor(file),
          splatAlphaRemovalThreshold: 5,
          showLoadingUI: true,
        });
        URL.revokeObjectURL(source);
        viewer.start();
        status.textContent = `${file.name} loaded.`;
      } catch (error) {
        console.error(error);
        status.textContent = `Could not load this splat: ${error.message}`;
      }
    });

    loadViewer().catch((error) => {
      console.error(error);
      status.textContent = "The local viewer library could not be loaded. Reload the page.";
    });
  </script>
</body>
</html>
